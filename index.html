<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banking Agentic Workflow Transformation Studio</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Agentic AI product operating packet</p>
        <h1>Banking Agentic Workflow Transformation Studio</h1>
      </div>
      <div class="release-pill" id="releasePill">Loading</div>
    </header>

    <section class="summary-grid" id="summaryGrid" aria-label="Portfolio summary"></section>

    <section class="workbench">
      <aside class="queue-panel">
        <div class="panel-head">
          <p class="eyebrow">Intake queue</p>
          <h2>Use Cases</h2>
        </div>
        <div class="queue-list" id="queueList"></div>
      </aside>

      <section class="detail-panel">
        <nav class="tabs" aria-label="Artifact sections">
          <button class="tab active" type="button" data-tab="intake">Intake</button>
          <button class="tab" type="button" data-tab="prd">PRD</button>
          <button class="tab" type="button" data-tab="gates">Gates</button>
          <button class="tab" type="button" data-tab="adoption">OKRs</button>
        </nav>
        <article id="detailSurface"></article>
      </section>
    </section>
  </main>
  <script src="src/app.js"></script>
</body>
</html>
